<text x="1285" y="213" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">连续会话、反馈确认</text>
<text x="1285" y="242" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">合法区间 + 电调端点</text>
<text x="1285" y="271" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">唯一 Servo 写入者：20ms</text>
<rect x="1530" y="145" width="250" height="170" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="1655" y="179" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">电调与车辆</text>
<text x="1655" y="213" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">PWM → ESC → 电机</text>
<text x="1655" y="242" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">刹车力度含物理时延</text>
<text x="1655" y="271" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">模式二：前后不对称</text>
