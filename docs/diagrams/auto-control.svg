<text x="1655" y="567" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">任务：校验完整 FE32</text>
<text x="1655" y="596" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">用途 / 会话随帧保存</text>
<rect x="1130" y="470" width="310" height="160" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="1285" y="504" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">8 项静态 FIFO</text>
<text x="1285" y="538" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">全部合法帧顺序交付</text>
<text x="1285" y="567" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">缺口立即撤销旧证据</text>
<text x="1285" y="596" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">不补发历史 PWM</text>
<rect x="725" y="455" width="320" height="180" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="885" y="489" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">Servo 逐帧观测</text>
<text x="885" y="523" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">幅值 m / 方向 D、K / 停稳 Z</text>
<text x="885" y="552" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">ESC 动作 S / 变化率 a</text>
<text x="885" y="581" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">动作许可单独维护</text>
<text x="885" y="610" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">批末发布一致快照</text>
<rect x="380" y="710" width="1010" height="112" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="885" y="744" text-anchor="middle" font-size="22" fill="#64748b" font-weight="700">24 字节上行 · 每 50ms 取最新结果</text>
<text x="885" y="778" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">保留速度 / 转向字段；幅值有效与方向可信分开；实际 ESC 状态不由控制意图替换</text>
<text x="910" y="879" text-anchor="middle" font-size="25" fill="#2563eb" font-weight="700">换向只按对应方向的证据路径执行</text>
