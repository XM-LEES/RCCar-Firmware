<text x="662.5" y="1003" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">保持 P_R 至少 100ms + 新 BRAKE</text>
<text x="662.5" y="1032" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">完整输出后新停稳证据</text>
<text x="662.5" y="1061" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">中间不得夹入中位</text>
