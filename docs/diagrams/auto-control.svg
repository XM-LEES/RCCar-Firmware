<text x="1152.5" y="1003" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">中位 ≥ 100ms + 新 NEUTRAL</text>
<text x="1152.5" y="1032" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">仍停稳 → 建立倒车资格</text>
