<text x="662.5" y="1203" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">减速依靠摩擦及负载</text>
<text x="662.5" y="1232" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">不发送正向刹车</text>
<rect x="970" y="1135" width="365" height="145" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
