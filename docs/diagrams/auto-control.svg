<text x="910" y="52" text-anchor="middle" font-size="32" fill="#2563eb" font-weight="700">AUTO纵向控制 · 完整 PID 与非对称动作</text>
<text x="910" y="89" text-anchor="middle" font-size="20" fill="#64748b" font-weight="400">当前实现：数值计算、动作许可与真实输出相互校验；RC 已验证路径独立保留</text>
