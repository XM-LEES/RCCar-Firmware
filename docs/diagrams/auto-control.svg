<text x="1396" y="1178" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">确认完成</text>
<text x="910" y="1342" text-anchor="middle" font-size="20" fill="#b45309" font-weight="700">初始许可未知：停稳 / 中位 → 正常负向查询 → DRIVE 确认倒车，或 BRAKE 确认后在原会话内升级资格制动</text>
<text x="910" y="1382" text-anchor="middle" font-size="20" fill="#64748b" font-weight="400">命令陈旧、证据缺口或动作冲突：下一控制截止点回中；未知方向不伪造符号，回中不等于物理驻车</text>
