<text x="160" y="179" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">有效目标 r</text>
<text x="160" y="213" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">直接使用命令速度</text>
<text x="160" y="242" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">0 / BRAKE：受控停车</text>
<text x="160" y="271" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">目标直接进入 PID</text>
<rect x="340" y="145" width="300" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="490" y="179" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">完整 PID</text>
<text x="490" y="213" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">e = r − v</text>
<text x="490" y="242" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">u_raw = Kp·e + I − Kd·a</text>
<text x="490" y="271" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">初始 Ki = Kd = 0</text>
<rect x="725" y="145" width="320" height="170" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="885" y="179" text-anchor="middle" font-size="22" fill="#b91c1c" font-weight="700">动作及刹车调度</text>
<text x="885" y="213" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">超速量 + 滑行进度</text>
<text x="885" y="242" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">预测释放 / 停稳 / 换向</text>
<text x="885" y="271" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">详见刹车介入与释放图</text>
