<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
  <title id="title">ESC观测链路与RC方向状态</title>
  <desc id="desc">图中展示PD15事件接收、RC逐帧观测队列、20ms控制周期、50ms上行、RC方向状态和有效性边界。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif; fill: #1f2933; }
      .title { font-size: 26px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #52606d; }
      .box { fill: #ffffff; stroke: #7b8794; stroke-width: 1.5; rx: 8; }
      .event { fill: #e0f2fe; stroke: #0284c7; }
      .control { fill: #ecfdf5; stroke: #059669; }
      .uplink { fill: #fff7ed; stroke: #ea580c; }
      .state { fill: #f8fafc; stroke: #475569; }
      .invalid { fill: #fef2f2; stroke: #dc2626; }
      .guard { fill: #f8fafc; stroke: #94a3b8; }
      .arrow { stroke: #334155; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
      .rule { stroke: #cbd5e1; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1000" fill="#f8fafc"/>
  <text x="40" y="45" class="title">ESC观测链路：事件、控制、上行分层</text>
  <text x="40" y="72" class="small">FE32动作不提供方向；方向来自RC/AUTO各自状态。Dashboard当前按有效位显示，安全逻辑不消费显示结果。</text>

  <text x="40" y="118" class="section">事件链路</text>
  <rect x="40" y="140" width="170" height="92" class="box event"/>
  <text x="58" y="170" class="label">PD15软件UART</text>
  <text x="58" y="194" class="small">字节时间戳</text>
  <text x="58" y="214" class="small">首字节32bit PWM上下文</text>

  <rect x="250" y="140" width="175" height="92" class="box event"/>
  <text x="268" y="170" class="label">FE32解析</text>
  <text x="268" y="194" class="small">CRC正确才产样本</text>
  <text x="268" y="214" class="small">末字节时间戳/epoch边界</text>

  <rect x="465" y="118" width="205" height="68" class="box event"/>
  <text x="483" y="148" class="label">最新FE32快照</text>
  <text x="483" y="170" class="small">AUTO 20ms读取</text>

  <rect x="465" y="204" width="205" height="72" class="box event"/>
  <text x="483" y="233" class="label">RC样本FIFO x8</text>
  <text x="483" y="255" class="small">完整样本按接收顺序</text>

  <rect x="720" y="160" width="230" height="96" class="box control"/>
  <text x="738" y="190" class="label">Servo任务拥有观测状态</text>
  <text x="738" y="214" class="small">通知：ProcessEscObservation</text>
  <text x="738" y="234" class="small">20ms：控制、输出、快照</text>

  <rect x="1010" y="160" width="180" height="96" class="box uplink"/>
  <text x="1028" y="190" class="label">50ms状态上行</text>
  <text x="1028" y="214" class="small">24B当前快照</text>
  <text x="1028" y="234" class="small">不是事件日志</text>

  <path d="M210 186 L250 186" class="arrow"/>
  <path d="M425 166 L465 154" class="arrow"/>
  <path d="M425 204 L465 238" class="arrow"/>
  <path d="M670 238 L720 214" class="arrow"/>
  <path d="M670 154 L720 188" class="arrow dashed"/>
  <path d="M950 208 L1010 208" class="arrow"/>

  <rect x="720" y="286" width="230" height="76" class="box control"/>
  <text x="738" y="316" class="label">20ms绝对控制deadline</text>
  <text x="738" y="340" class="small">FE32通知不改变控制周期</text>
  <path d="M835 286 L835 256" class="arrow"/>

  <text x="40" y="330" class="section">RC方向状态</text>
  <rect x="40" y="372" width="220" height="92" class="box state"/>
  <text x="64" y="406" class="label">方向未知 D=0</text>
  <text x="64" y="432" class="small">等待中位N、DRIVE、M=1</text>

  <rect x="340" y="340" width="230" height="92" class="box state"/>
  <text x="364" y="374" class="label">前进 D=+1</text>
  <text x="364" y="400" class="small">BRAKE/NEUTRAL保持方向</text>

  <rect x="340" y="500" width="230" height="92" class="box state"/>
  <text x="364" y="534" class="label">倒车 D=-1</text>
  <text x="364" y="560" class="small">中位PWM不清方向</text>

  <path d="M260 404 L340 382" class="arrow"/>
  <path d="M260 438 L340 542" class="arrow"/>
  <path d="M570 386 C630 420 630 515 570 546" class="arrow"/>
  <path d="M340 548 C292 520 292 415 340 386" class="arrow"/>

  <g transform="translate(0 45)">
  <rect x="640" y="330" width="600" height="270" class="box guard"/>
  <text x="662" y="360" class="section">方向判定条件</text>
  <text x="662" y="390" class="label">N：两份不同NEUTRAL样本，rpm_valid=1、rpm_raw=0、PWM相同</text>
  <text x="690" y="416" class="small">最近5个候选取中位；q为首字节PWM相对N的方向侧</text>
  <text x="662" y="444" class="label">M=1：同一FE32样本幅值有效，且速度超过停稳阈值</text>
  <text x="662" y="472" class="label">H：已见非DRIVE，或相反侧DRIVE但没有可用运动证据</text>
  <line x1="662" y1="490" x2="1218" y2="490" class="rule"/>
  <text x="662" y="518" class="small">启动：D未知时，连续两个不同DRIVE样本满足同一q且M=1，确认D=q。</text>
  <text x="662" y="546" class="small">保持：q=0、BRAKE、NEUTRAL或同向DRIVE都保持已确认方向。</text>
  <text x="662" y="574" class="small">换向：D已知，q相反、H=1且M=1，推定D=q；H=0时保持旧D。</text>
  </g>

  <g transform="translate(0 55)">
  <rect x="40" y="625" width="590" height="106" class="box"/>
  <text x="62" y="656" class="section">速度有效性</text>
  <text x="62" y="686" class="label">新鲜RPM有效且换算可用：发布幅值；方向已知才发布有符号速度。</text>
  <text x="62" y="714" class="label">新样本RPM无效或换算不可用：立即清幅值有效性，不沿用旧有效幅值。</text>

  <rect x="680" y="625" width="560" height="106" class="box invalid"/>
  <text x="704" y="656" class="section">边界不会被隐藏</text>
  <text x="704" y="686" class="label">方向未知：bit23=0；停稳：bit12=1且速度=0。</text>
  <text x="704" y="714" class="label">RX错误、epoch/source变化、队列溢出：旧换向证据失效。</text>

  <text x="40" y="775" class="section">职责分离</text>
  <rect x="40" y="800" width="270" height="82" class="box"/>
  <text x="62" y="830" class="label">固件观测</text>
  <text x="62" y="854" class="small">发布数值与validity，不伪造方向</text>

  <rect x="340" y="800" width="270" height="82" class="box"/>
  <text x="362" y="830" class="label">Dashboard当前行为</text>
  <text x="362" y="854" class="small">按有效位显示；无效为空白，不插值</text>

  <rect x="640" y="800" width="270" height="82" class="box"/>
  <text x="662" y="830" class="label">控制与安全</text>
  <text x="662" y="854" class="small">只看固件有效位、停稳和门控</text>

  <rect x="940" y="800" width="300" height="82" class="box"/>
  <text x="962" y="830" class="label">里程计/融合</text>
  <text x="962" y="854" class="small">方向未知保持不确定，不构造符号位移</text>
  </g>
</svg>
