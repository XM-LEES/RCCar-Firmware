<title id="title">ESC观测与RC/AUTO方向推断</title><desc id="desc">从PD15字节接收、RC/AUTO共享观测FIFO、Servo逐帧观测，到24字节速度上报；下部为RC方向转移及证据失效路径。</desc>
<rect width="100%" height="100%" fill="white"/>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b45309"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b91c1c"/></marker>
</defs><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="910" y="60" text-anchor="middle" font-size="31" font-weight="700" fill="#2563eb">ESC观测 · 完整样本、方向推断与速度发布</text>
<text x="910" y="101" text-anchor="middle" font-size="19" font-weight="400" fill="#64748b">RC/AUTO逐帧消费同一FIFO；PWM命令每20ms更新，上行每50ms发送</text>
<text x="910" y="151" text-anchor="middle" font-size="23" font-weight="700" fill="#2563eb">接收与发布路径</text>
<polyline points="295,250 365,250" stroke="#0f766e" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
<polyline points="635,250 725,250" stroke="#0f766e" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
<polyline points="1015,250 1095,250" stroke="#0f766e" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
<polyline points="1395,250 1495,250" stroke="#0f766e" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
<polyline points="500,320 500,435" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-gray)"/>
<polyline points="635,505 725,505" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow-gray)"/>
<polyline points="1245,435 1245,320" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
<polyline points="1245,575 1245,625 170,625 170,320" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="7 6"/>
<rect x="45" y="180" width="250" height="140" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
<text x="170" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">PD15字节接收</text>
<text x="170" y="246" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">115200 / 8N1</text>
<text x="170" y="273" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">逐字节保存接收时刻</text>
<text x="170" y="300" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">保存两字输出上下文</text>
<rect x="365" y="180" width="270" height="140" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
<text x="500" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">FE32解码</text>
<text x="500" y="246" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">32字节 + 前缀 + CRC</text>
<text x="500" y="273" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">首字节两字上下文、末字节时间</text>
<text x="500" y="300" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">校验source一致性</text>
<rect x="725" y="180" width="290" height="140" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
<text x="870" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">RC/AUTO观测FIFO</text>
<text x="870" y="246" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">固定8项，按帧顺序</text>
<text x="870" y="273" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">RC或显式AUTO入队</text>
<text x="870" y="300" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">队满建立delivery缺口</text>
<rect x="1095" y="180" width="300" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="1245" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Servo任务 · RC/AUTO观测</text>
<text x="1245" y="246" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">按顺序更新幅值/方向/停稳</text>
<text x="1245" y="273" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">批末发布一致快照</text>
<text x="1245" y="300" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">新帧唤醒不额外写PWM</text>
<rect x="1495" y="180" width="280" height="140" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="1635" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">速度上报</text>
<text x="1635" y="246" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">有效方向 × 最新有效幅值</text>
<text x="1635" y="273" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">停稳优先；未知方向带有效位</text>
<text x="1635" y="300" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">24字节，50ms取最新结果</text>
<rect x="365" y="435" width="270" height="140" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="500" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">最新原始快照</text>
<text x="500" y="501" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">每份合法FE32均更新</text>
<text x="500" y="528" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">即使观测上下文不入队</text>
<text x="500" y="555" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">仍保留原始RPM及有效性</text>
<rect x="725" y="435" width="290" height="140" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="870" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">仅幅值回退</text>
<text x="870" y="501" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">合法帧无可用输出上下文</text>
<text x="870" y="528" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">清除受影响的方向/停稳证据</text>
<text x="870" y="555" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">不提供AUTO动作许可</text>
<rect x="1095" y="435" width="300" height="140" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="1245" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">20ms控制截止点</text>
<text x="1245" y="501" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">RC输入、AUTO计算、PWM更新</text>
<text x="1245" y="528" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">通知不移动原定截止点</text>
<text x="1245" y="555" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">先处理反馈，再提交新命令</text>
<text x="550" y="382" text-anchor="middle" font-size="17" font-weight="700" fill="#64748b">保留最新帧</text>
<text x="1055" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">通知</text>
<text x="1323" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">固定周期</text>
<text x="690" y="613" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">实际CCR写入与上下文索引在同一短PRIMASK区提交</text>
<text x="910" y="679" text-anchor="middle" font-size="18" font-weight="400" fill="#64748b">上下文是软件命令，不是ESC内部采样时刻；帧内PWM/metadata可变，但按首字节解释。</text>
<text x="910" y="744" text-anchor="middle" font-size="26" font-weight="700" fill="#2563eb">RC方向状态转移</text>
<text x="910" y="782" text-anchor="middle" font-size="18" font-weight="400" fill="#64748b">q = sign(P − N)；N为学习中位，M为同帧运动证据，H为已保存的换向过渡证据</text>
<polyline points="370,976 460,976 460,821 845,821 845,850" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
<polyline points="370,1030 450,1030 450,1120 1555,1120 1555,980" stroke="#b45309" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/>
<polyline points="1010,886 1390,886" stroke="#b45309" stroke-width="2.2" fill="none" marker-end="url(#arrow-orange)"/>
<polyline points="1390,954 1010,954" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
<polyline points="70,1285 40,1285 40,992 70,992" stroke="#b91c1c" stroke-width="2.2" fill="none" marker-end="url(#arrow-red)"/>
<rect x="70" y="930" width="300" height="135" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="220" y="965" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">方向未知 D=0</text>
<text x="220" y="996" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">先学习中位，再确认方向</text>
<text x="220" y="1023" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">初次确认需同侧DRIVE两帧</text>
<text x="220" y="1050" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">有幅值仍可上报；bit23=0</text>
<rect x="680" y="850" width="330" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="845" y="885" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">前进 D=+1</text>
<text x="845" y="916" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">有效非零速度为正</text>
<text x="845" y="943" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">刹车或滑行继续保持正向</text>
<rect x="1390" y="850" width="330" height="130" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
<text x="1555" y="885" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">倒车 D=−1</text>
<text x="1555" y="916" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">有效非零速度为负</text>
<text x="1555" y="943" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">刹车或滑行继续保持反向</text>
<text x="656" y="808" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">前进侧DRIVE × 2，M=1</text>
<text x="1180" y="1106" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">倒车侧DRIVE × 2，M=1</text>
<text x="1200" y="872" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">H=1 · 倒车侧DRIVE · M=1</text>
<text x="1200" y="1009" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">H=1 · 前进侧DRIVE · M=1</text>
<text x="1020" y="1054" text-anchor="middle" font-size="17" font-weight="400" fill="#64748b">保持原方向：中位PWM、BRAKE、NEUTRAL；H=0时相反侧DRIVE也保持</text>
<text x="910" y="1171" text-anchor="middle" font-size="18" font-weight="400" fill="#64748b">H由BRAKE / NEUTRAL，或相反侧DRIVE且M=0设置；H不等于机械停稳或电调倒车许可。</text>
<rect x="70" y="1220" width="1650" height="135" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="895" y="1255" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">证据失效 → 回到方向未知</text>
<text x="895" y="1286" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">源切换、遥测超时、RX失效、上下文拒绝或交付缺口：清方向、换向证据和停稳累计，保留已学中位。</text>
<text x="895" y="1313" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">未知动作也清方向；RPM无效清幅值有效性。新鲜RPM仍可用但方向未知时，只发布幅值。</text>
<text x="895" y="1340" text-anchor="middle" font-size="18" font-weight="400" fill="#0f172a">正常中位PWM不制造缺口；已经确认的方向保持，幅值继续跟随最新样本。</text>
<text x="910" y="1398" text-anchor="middle" font-size="18" font-weight="400" fill="#64748b">AUTO相反推进在停稳后先清旧方向，再由新purpose/session的DRIVE确认；详见 ESC_OBSERVATION.md。</text>
</g></svg>
