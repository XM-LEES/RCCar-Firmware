<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1570" viewBox="0 0 1820 1570" role="img" aria-labelledby="title"><title id="title">前进跟踪刹车：介入、调节、提前释放及许可恢复</title><rect width="1820" height="1570" fill="white"/><defs>
<marker id="a-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="a-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
<marker id="a-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b45309"/></marker>
<marker id="a-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#b91c1c"/></marker>
<marker id="a-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker>
</defs><g font-family="Noto Sans CJK SC, sans-serif">
<text x="910" y="52" text-anchor="middle" font-size="32" fill="#b91c1c" font-weight="700">前进跟踪刹车 · 介入、力度、释放</text>
<text x="910" y="90" text-anchor="middle" font-size="19" fill="#64748b" font-weight="400">适用：前进且目标 r &gt; 0；停车保持至实测停稳，换向使用连续完整行程，均不套用本图的跟踪释放条件</text>
<rect x="535" y="132" width="750" height="122" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="910" y="166" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">最新有效前进观测</text>
<text x="910" y="200" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">Δ = v − r；E_on = max(0.20, 0.10r)；E_off = max(0.05, 0.02r)</text>
<text x="910" y="229" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">仅 Δ &gt; E_off 进入下面减速路径；否则按正常 PID 推进</text>
<polyline points="910,254 910,280 265,280 265,330" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a-red)"/>
<polyline points="910,280 1125,280 1125,330" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>
<rect x="340" y="255" width="220" height="30" rx="4" fill="white"/>
<text x="450" y="277" text-anchor="middle" font-size="18" fill="#b91c1c" font-weight="700">Δ ≥ E_on</text>
<rect x="1190" y="255" width="340" height="30" rx="4" fill="white"/>
<text x="1360" y="277" text-anchor="middle" font-size="18" fill="#64748b" font-weight="700">E_off &lt; Δ &lt; E_on</text>
<rect x="45" y="330" width="440" height="145" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="265" y="364" text-anchor="middle" font-size="22" fill="#b91c1c" font-weight="700">大幅降速：立即申请</text>
<text x="265" y="398" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">撤销正向推进、清 I</text>
<text x="265" y="427" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">不等待 200ms 滑行评估</text>
<text x="265" y="456" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">仍须通过释放预测及动作许可</text>
<rect x="680" y="330" width="890" height="145" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1125" y="364" text-anchor="middle" font-size="22" fill="#64748b" font-weight="700">小幅降速：先回中滑行</text>
<text x="1125" y="398" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">T_need = (Δ − E_off) / (−a)，仅 a &lt; −0.05 时使用，否则为 ∞</text>
<text x="1125" y="427" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">200ms 后：T_need &gt; 剩余预算，或滑行已满 600ms → 申请刹车</text>
<text x="1125" y="456" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">减速足够快则继续滑行；重复命令不重启计时</text>
<polyline points="265,475 265,510 750,510 750,550" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a-red)"/>
<polyline points="1125,475 1125,510 1050,510 1050,550" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a-red)"/>
<rect x="610" y="550" width="600" height="132" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="910" y="584" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">申请必须通过两个检查</text>
<text x="910" y="618" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">① 尚未满足实际 / 预测释放条件</text>
<text x="910" y="647" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">② 已确认正向 DRIVE，F_READY 尚未被消费</text>
<polyline points="610,616 485,616" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>
<rect x="494" y="576" width="96" height="30" rx="4" fill="white"/>
<text x="542" y="598" text-anchor="middle" font-size="18" fill="#64748b" font-weight="700">不通过</text>
<rect x="45" y="555" width="440" height="130" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="265" y="589" text-anchor="middle" font-size="22" fill="#64748b" font-weight="700">中位等待</text>
<text x="265" y="623" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">预测已足够：继续滑行观察</text>
<text x="265" y="652" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">许可不足：记录禁止原因</text>
<text x="265" y="681" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">超时 / 大误差均不能授予许可</text>
<polyline points="910,682 910,730" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a-red)"/>
<rect x="942.5" y="694" width="145" height="30" rx="4" fill="white"/>
<text x="1015" y="716" text-anchor="middle" font-size="18" fill="#b91c1c" font-weight="700">通过并消费许可</text>
<rect x="535" y="730" width="750" height="150" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="910" y="764" text-anchor="middle" font-size="22" fill="#b91c1c" font-weight="700">同一次连续负向制动</text>
<text x="910" y="798" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">B = clip(max(B_hold, −u_raw), B_hold, P0 − P_R)；P = P0 − B</text>
<text x="910" y="827" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">B_hold 固定取标定后的 B_min；误差缩小可减弱力度</text>
<text x="910" y="856" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">不靠中位脉冲调力；新 BRAKE 确认实际动作</text>
<polyline points="1285,805 1450,805" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#a-orange)"/>
<rect x="1294.5" y="764" width="145" height="30" rx="4" fill="white"/>
<text x="1367" y="786" text-anchor="middle" font-size="18" fill="#b45309" font-weight="700">反馈不一致</text>
<rect x="1450" y="735" width="325" height="145" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="1612.5" y="769" text-anchor="middle" font-size="22" fill="#b45309" font-weight="700">动作一致性丢失</text>
<text x="1612.5" y="803" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">回中、撤销旧许可</text>
<text x="1612.5" y="832" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">保留可用速度幅值</text>
<text x="1612.5" y="861" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">禁止加大力度自动重试</text>
<polyline points="910,880 910,930" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a-red)"/>
<rect x="535" y="930" width="750" height="154" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="910" y="964" text-anchor="middle" font-size="22" fill="#0f766e" font-weight="700">跟踪制动释放 · 满足任一项</text>
<text x="910" y="998" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">实测 v ≤ r + E_off；或连续两份新样本 a &lt; 0 且 v + a·H_s ≤ r + E_off</text>
<text x="910" y="1027" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">H_s = (样本年龄ms + 20 + 释放延迟ms) / 1000；延迟初值 80ms</text>
<text x="910" y="1056" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">新目标无需减速且正常 PID 要求正向，也结束制动</text>
<polyline points="535,1007 400,1007 400,806 535,806" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#a-red)"/>
<rect x="298" y="889" width="200" height="30" rx="4" fill="white"/>
<text x="398" y="911" text-anchor="middle" font-size="18" fill="#b91c1c" font-weight="700">未满足：连续调力</text>
<polyline points="910,1084 910,1140" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
<rect x="972" y="1098" width="120" height="30" rx="4" fill="white"/>
<text x="1032" y="1120" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">满足：释放</text>
<rect x="535" y="1140" width="750" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="910" y="1174" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">F_RECOVER：正常正向 PID 或中位</text>
<text x="910" y="1208" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">PID 有正向需求才推进；不额外制造固定油门来恢复许可</text>
<text x="910" y="1237" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">同一次负向会话已经结束，不因仍超速就补第二次负向信号</text>
<polyline points="535,1205 300,1205 300,1400 535,1400" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a-blue)"/>
<polyline points="1285,1205 1500,1205 1500,1400 1285,1400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>
<rect x="130" y="1296" width="340" height="30" rx="4" fill="white"/>
<text x="300" y="1318" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700">新正向 DRIVE + 前进方向确认</text>
<rect x="1330" y="1296" width="340" height="30" rx="4" fill="white"/>
<text x="1500" y="1318" text-anchor="middle" font-size="18" fill="#64748b" font-weight="700">无确认，仍超速</text>
<rect x="535" y="1350" width="365" height="105" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="717.5" y="1384" text-anchor="middle" font-size="22" fill="#2563eb" font-weight="700">重新建立 F_READY</text>
<text x="717.5" y="1418" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">新的超速请求可再次申请制动</text>
<rect x="920" y="1350" width="365" height="105" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="1102.5" y="1384" text-anchor="middle" font-size="22" fill="#64748b" font-weight="700">继续中位</text>
<text x="1102.5" y="1418" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="400">BRAKE_REARM_REQUIRED</text>
<text x="910" y="1517" text-anchor="middle" font-size="19" fill="#64748b" font-weight="400">预测只决定何时松刹；不能证明停稳、方向或倒车资格。数值均为工程初值，实车延迟与制动力须据响应记录标定。</text>
</g></svg>
