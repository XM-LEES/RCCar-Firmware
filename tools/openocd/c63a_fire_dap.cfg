# C63A STM32F407VET6 with the observed Fire CMSIS-DAP (c251:f001).
# This file configures the transport; it does not erase or program Flash.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0xc251 0xf001
cmsis_dap_backend hid
transport select swd
source [find target/stm32f4x.cfg]
# Apply after the target script, which sets its own initial speed.
adapter speed 1000
